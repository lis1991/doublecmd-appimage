name: 🧰 Build Double Commander AppImage with AppImageBuilder

on:
  schedule:
    - cron: '0 4 * * 0'  # Каждое воскресенье в 04:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GTK2
          - toolkit: gtk2
            arch: x86_64
            apt_arch: amd64
            appimage_arch: x86_64
            appimagetool_arch: x86_64
            qemu: false
          - toolkit: gtk2
            arch: i386
            apt_arch: i386
            appimage_arch: i686
            appimagetool_arch: x86_64
            qemu: false
          - toolkit: gtk2
            arch: aarch64
            apt_arch: arm64
            appimage_arch: aarch64
            appimagetool_arch: aarch64
            qemu: true
          # Qt5
          - toolkit: qt
            arch: x86_64
            apt_arch: amd64
            appimage_arch: x86_64
            appimagetool_arch: x86_64
            qemu: false
          - toolkit: qt
            arch: i386
            apt_arch: i386
            appimage_arch: i686
            appimagetool_arch: x86_64
            qemu: false
          - toolkit: qt
            arch: aarch64
            apt_arch: arm64
            appimage_arch: aarch64
            appimagetool_arch: aarch64
            qemu: true
          # Qt6
          - toolkit: qt6
            arch: x86_64
            apt_arch: amd64
            appimage_arch: x86_64
            appimagetool_arch: x86_64
            qemu: false
          - toolkit: qt6
            arch: aarch64
            apt_arch: arm64
            appimage_arch: aarch64
            appimagetool_arch: aarch64
            qemu: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU (aarch64 only)
        if: matrix.qemu == true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl desktop-file-utils libglib2.0-0

      - name: 💾 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('**/AppImageBuilder.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pip-

      - name: 💾 Cache appimagetool
        id: cache-appimagetool
        uses: actions/cache@v4
        with:
          path: ~/appimagetool.AppImage
          key: appimagetool-${{ matrix.appimagetool_arch }}

      - name: 💾 Cache AppImage runtime
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: ~/AppImageKit-runtime-${{ matrix.appimage_arch }}
          key: AppImageKit-runtime-${{ matrix.appimage_arch }}

      - name: 📦 Установить AppImageBuilder
        run: |
          sudo apt install -y python3-pip
          pip3 install appimage-builder

      - name: 🔧 Установить кэшированный appimagetool (если есть)
        if: steps.cache-appimagetool.outputs.cache-hit == 'true'
        run: |
          chmod +x ~/appimagetool.AppImage
          sudo mv ~/appimagetool.AppImage /usr/local/bin/appimagetool

      - name: 🔧 Подготовить кэшированный runtime (если есть)
        if: steps.cache-runtime.outputs.cache-hit == 'true'
        run: |
          mkdir -p ~/.cache/appimage-builder
          cp ~/AppImageKit-runtime-${{ matrix.appimage_arch }} ~/.cache/appimage-builder/runtime-${{ matrix.appimage_arch }}

      - name: 🔍 Определить версию Double Commander
        id: get_dc_version
        run: |
          LATEST_URL=$(curl -s "https://sourceforge.net/projects/doublecmd/rss?path=/" | \
            grep -o '<link>https://sourceforge.net/projects/doublecmd/files/[^"]*doublecmd-[0-9.]*\.qt6\.x86_64\.tar\.xz/download' | \
            head -1 | sed 's/<link>//')
          if [ -z "$LATEST_URL" ]; then
            echo "❌ Не удалось получить URL из RSS"
            exit 1
          fi
          DC_VERSION=$(echo "$LATEST_URL" | grep -oP 'doublecmd-\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "✅ Версия Double Commander: $DC_VERSION"
          echo "dc_version=$DC_VERSION" >> $GITHUB_OUTPUT

      - name: 🛠️ Подготовить AppImageBuilder.yml для текущей связки тулкит+архитектура
        run: |
          VER="${{ steps.get_dc_version.outputs.dc_version }}"
          RECIPE="AppImageBuilder-${{ matrix.toolkit }}-${{ matrix.arch }}.yml"
          cp AppImageBuilder.yml "$RECIPE"
          # Версия: latest → реальная (в app_info и в file_name)
          sed -i "s/version: latest/version: $VER/" "$RECIPE"
          sed -i "s/DoubleCommander-latest-/DoubleCommander-$VER-/" "$RECIPE"
          # Тулкит (id и file_name)
          sed -i "s/__TOOLKIT__/${{ matrix.toolkit }}/g" "$RECIPE"
          # Паттерн скачивания tar.xz: qt6.x86_64 → <toolkit>.<arch>
          sed -i "s/qt6\.x86_64/${{ matrix.toolkit }}.${{ matrix.arch }}/g" "$RECIPE"
          # apt arch
          sed -i "s/arch: amd64/arch: ${{ matrix.apt_arch }}/" "$RECIPE"
          # AppImage runtime arch (для i386 → i686)
          sed -i "s/arch: x86_64/arch: ${{ matrix.appimage_arch }}/" "$RECIPE"
          # Архитектура в имени итогового файла
          sed -i "s/-x86_64\.AppImage/-${{ matrix.arch }}.AppImage/" "$RECIPE"
          # Для aarch64: apt source
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sed -i "s|http://archive.ubuntu.com/ubuntu/|http://ports.ubuntu.com/ubuntu-ports/|g" "$RECIPE"
          fi
          echo "📄 Итоговый конфиг:"
          cat "$RECIPE"

      - name: 🔨 Build Double Commander AppImage
        run: |
          appimage-builder --recipe AppImageBuilder-${{ matrix.toolkit }}-${{ matrix.arch }}.yml --skip-test

      - name: 💾 Сохранить appimagetool в кэш
        if: steps.cache-appimagetool.outputs.cache-hit != 'true'
        run: |
          if [ ! -f ~/appimagetool.AppImage ]; then
            wget -O ~/appimagetool.AppImage "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.appimagetool_arch }}.AppImage"
            chmod +x ~/appimagetool.AppImage
          fi

      - name: 💾 Сохранить runtime в кэш
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          if [ -f ~/.cache/appimage-builder/runtime-${{ matrix.appimage_arch }} ]; then
            cp ~/.cache/appimage-builder/runtime-${{ matrix.appimage_arch }} ~/AppImageKit-runtime-${{ matrix.appimage_arch }}
          fi

      - name: 🐞 Debug - List files after build
        run: |
          ls -la
          find . -name "*.AppImage" -type f 2>/dev/null || echo "Файлы .AppImage не найдены"

      - name: 📤 Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubleCommander-AppImage-${{ matrix.toolkit }}-${{ matrix.arch }}
          path: "*.AppImage"

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 📥 Download all AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DoubleCommander-AppImage-*
          path: ./artifacts
          merge-multiple: true

      - name: 🔖 Prepare release files and notes
        id: prep
        run: |
          FIRST=$(find ./artifacts -name "*.AppImage" | head -1)
          DC_VERSION=$(basename "$FIRST" | grep -oP '(?<=DoubleCommander-)[0-9]+\.[0-9]+\.[0-9]+')
          echo "dc_version=$DC_VERSION" >> $GITHUB_OUTPUT
          {
            echo "notes<<NOTES"
            echo "## 📦 Double Commander $DC_VERSION — AppImage"
            echo ""
            echo "| Файл | Тулкит | Архитектура | Размер |"
            echo "|---|---|---|---|"
            for f in ./artifacts/*.AppImage; do
              NAME=$(basename "$f")
              SIZE=$(du -h "$f" | cut -f1)
              TK=$(echo "$NAME" | sed -E 's/^DoubleCommander-[0-9.]+-([a-z0-9]+)-[a-z0-9_]+\.AppImage$/\1/')
              AR=$(echo "$NAME" | sed -E 's/^DoubleCommander-[0-9.]+-[a-z0-9]+-([a-z0-9_]+)\.AppImage$/\1/')
              echo "| $NAME | $TK | $AR | $SIZE |"
            done
            echo ""
            echo "> Сборка выполнена автоматически через GitHub Actions + AppImageBuilder."
            echo "NOTES"
          } >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.dc_version }}
          files: ./artifacts/*.AppImage
          body: ${{ steps.prep.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
